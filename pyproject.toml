[project]
name = "project-phoenix"
version = "0.1.0"
description = "Autonomous MLOps platform — Phoenix monorepo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "evidently>=0.7.21",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "pandas>=2.3.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "uvicorn>=0.47.0",
    "ml-core[alchemist,challenger]",
    "openai>=2.37.0",
    "snowflake-connector-python>=4.5.0",
    "reportlab>=4.5.1",
    "razorpay>=2.0.1",
    "supabase>=2.30.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "email-validator>=2.1.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/ml-core", "apps/api"]

[tool.uv.sources]
ml-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]
