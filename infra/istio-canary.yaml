apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: phoenix-model-service
spec:
  hosts:
  - phoenix-model.phoenix.svc.cluster.local
  http:
  - route:
    - destination:
        host: phoenix-baseline
      weight: 90
    - destination:
        host: phoenix-challenger
      weight: 10
